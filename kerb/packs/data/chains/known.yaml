id: chains/known
version: 1
label: Known multi-location brands
description: >
  Brands recognisable from a single row, so a chain is caught even when only
  one of its branches falls inside the search area. The dataset tally cannot
  see that case: one branch in the area looks exactly like an independent.

  Deliberately short and conservative. A false positive here deletes a real
  lead, so entries are limited to brands that are unambiguously multi-site.
  Add your own in ~/.kerb/packs/chains/known.yaml -- a user pack of the same
  id replaces this one wholesale.

brands:
