id: web-presence/booking-hosts
version: 1
label: Booking platforms
description: |
  A link here means the business rents a page on someone else's product. It is
  NOT a website, and the business is still a prospect. Filtering a scraper's
  export on "website IS NULL" silently discards every one of these -- which in
  the salon and barber trades is a large share of the market.

  Regional by nature: no single team can maintain this globally, which is
  precisely why it is community data. Entries marked (found) were discovered
  automatically by the collision rule -- a domain shared by unrelated
  businesses cannot be any one business's own domain.
