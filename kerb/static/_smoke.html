<!doctype html>
<meta charset="utf-8"><title>smoke</title>
<style>html,body{margin:0;height:100%}iframe{border:0;display:block}</style>
<iframe id="f" src="/"></iframe>
<script>
const P = new URLSearchParams(location.search);
const W = +(P.get("w") || 1600), H = +(P.get("h") || 1000);
const fr = document.getElementById("f");
fr.style.width = W + "px"; fr.style.height = H + "px";

const errs = [];
addEventListener("error", e => errs.push(e.message));
const wait = ms => new Promise(r => setTimeout(r, ms));
const L = (k, v) => console.log("SMOKE " + k + "=" + v);

fr.addEventListener("load", async () => {
  const w = fr.contentWindow, d = w.document;
  w.addEventListener("error", e => errs.push("iframe: " + e.message));
  w.addEventListener("unhandledrejection", e => errs.push("reject: " + e.reason));
  await wait(600);

  const scenario = P.get("s") || "full";
  const theme = P.get("theme");
  if (theme) d.documentElement.setAttribute("data-theme", theme);

  // ---- builder controls populated from the API -------------------------
  L("sources", d.getElementById("source").options.length);
  L("packs", d.getElementById("pack").options.length);
  L("filterToggles", d.querySelectorAll("[data-on]").length);
  L("presenceBoxes", d.querySelectorAll('[data-multi="presence"]').length);
  L("sliders", d.querySelectorAll("[data-w]").length);

  // ---- source switching shows/hides the right fields --------------------
  const sel = d.getElementById("source");
  sel.value = "overpass"; sel.dispatchEvent(new w.Event("input", {bubbles:true}));
  await wait(350);
  L("overpass_showsPlaces", !d.getElementById("placesField").hidden);
  L("overpass_hidesPath", d.getElementById("pathField").hidden);
  L("overpass_noPlaces_blocksRun", d.getElementById("runBtn").disabled);
  L("overpass_showsProblem", /no places/i.test(d.getElementById("problems").textContent));

  d.getElementById("places").value = "Islington, London";
  d.getElementById("places").dispatchEvent(new w.Event("input", {bubbles:true}));
  await wait(400);
  L("overpass_withPlaces_allowsRun", !d.getElementById("runBtn").disabled);

  sel.value = "csv"; sel.dispatchEvent(new w.Event("input", {bubbles:true}));
  await wait(300);
  L("csv_showsPath", !d.getElementById("pathField").hidden);

  // ---- inspect: bad path then good path --------------------------------
  const path = d.getElementById("path");
  path.value = "/nope/missing.csv";
  path.dispatchEvent(new w.Event("input", {bubbles:true}));
  d.getElementById("inspectBtn").click();
  await wait(700);
  L("inspect_badPath_showsError", /notice bad/.test(d.getElementById("inspectOut").innerHTML));

  path.value = "tests/fixtures/gosom_export.csv";
  path.dispatchEvent(new w.Event("input", {bubbles:true}));
  d.getElementById("inspectBtn").click();
  await wait(700);
  L("inspect_good_showsRows", /10 rows/.test(d.getElementById("inspectOut").textContent));
  L("inspect_detectsGosom", /gosom/.test(d.getElementById("inspectOut").textContent));

  // ---- YAML copy: must give SOME feedback even when clipboard is refused
  d.getElementById("yamlBtn").click(); await wait(600);
  const copied = /Copied/.test(d.getElementById("yamlBtn").textContent);
  const fellBack = !!d.getElementById("yamlText");
  L("yaml_feedbackEither", copied || fellBack);
  L("yaml_fallbackHasContent",
    fellBack ? (d.getElementById("yamlText").value.includes("sources:")) : "n/a(copied)");

  await wait(500);
  L("runBtn_enabled", !d.getElementById("runBtn").disabled);
  d.getElementById("runBtn").click();
  await wait(2400);

  // ---- results ----------------------------------------------------------
  const rows = () => Array.from(d.querySelectorAll("#rows tr[data-cid]"));
  L("qualifiedRows", rows().length);
  L("stageHidden", d.getElementById("stage").hidden);
  L("stopHidden", d.getElementById("stopBtn").hidden);
  L("funnelShown", !d.getElementById("funnel").hidden);
  L("funnelSegments", d.querySelectorAll(".funnel-seg").length);
  L("topStats", d.querySelectorAll("#topStats .stat").length);

  const scores = () => rows().map(r => parseFloat(r.querySelector(".score").textContent) || 0);
  L("sortedByScoreDesc", JSON.stringify(scores()) === JSON.stringify([...scores()].sort((a,b)=>b-a)));

  // ---- tabs -------------------------------------------------------------
  d.querySelector('[data-view="rejected"]').click(); await wait(250);
  const rejRows = rows();
  L("rejectedRows", rejRows.length);
  L("everyRejectedHasReason",
    rejRows.every(r => r.querySelector(".reason").textContent.trim().length > 0));
  d.querySelector('[data-view="all"]').click(); await wait(250);
  L("allRows", rows().length);
  d.querySelector('[data-view="qualified"]').click(); await wait(250);

  // ---- search -----------------------------------------------------------
  const s = d.getElementById("search");
  s.value = "chelsea"; s.dispatchEvent(new w.Event("input", {bubbles:true}));
  await wait(250);
  L("search_narrows", rows().length);
  s.value = "zzzznomatch"; s.dispatchEvent(new w.Event("input", {bubbles:true}));
  await wait(250);
  L("search_emptyState", /Nothing matches/.test(d.getElementById("rows").textContent));
  s.value = ""; s.dispatchEvent(new w.Event("input", {bubbles:true}));
  await wait(250);

  // ---- sorting ----------------------------------------------------------
  d.querySelector('th[data-sort="reviews"]').click(); await wait(250);
  const rev = rows().map(r => parseInt(r.querySelectorAll("td.num")[1].textContent) || 0);
  L("sortByReviewsDesc", JSON.stringify(rev) === JSON.stringify([...rev].sort((a,b)=>b-a)));
  d.querySelector('th[data-sort="name"]').click(); await wait(250);
  const nm = rows().map(r => r.querySelector(".name").textContent.trim().toLowerCase());
  L("sortByNameAsc", JSON.stringify(nm) === JSON.stringify([...nm].sort()));
  d.querySelector('th[data-sort="score"]').click(); await wait(250);

  // ---- drawer -----------------------------------------------------------
  rows()[0].click(); await wait(700);
  const dr = d.getElementById("drawer");
  L("drawerOpens", !dr.hidden);
  L("drawerHasEvidence", dr.querySelectorAll(".ev").length);
  L("drawerHasPackVersion", /trades\/dentist@/.test(dr.textContent));
  L("drawerHasListing", /CID/.test(dr.textContent));
  L("rowSelectedHighlight", rows()[0].getAttribute("aria-selected") === "true");

  // ---- rescore via slider (no refetch) ----------------------------------
  const before = rows().map(r => r.querySelector(".score").textContent.trim());
  const rs = d.querySelector('[data-w="reviews"]');
  rs.value = "60"; rs.dispatchEvent(new w.Event("input", {bubbles:true}));
  const wp = d.querySelector('[data-w="web_presence"]');
  wp.value = "0"; wp.dispatchEvent(new w.Event("input", {bubbles:true}));
  await wait(1200);
  const after = rows().map(r => r.querySelector(".score").textContent.trim());
  // Scores, not order: whether a weight change reorders THIS dataset depends on
  // the dataset. That the scores moved is what proves the rescore ran.
  L("rescoreChangedScores", JSON.stringify(before) !== JSON.stringify(after));
  L("rescoreLabelUpdated", d.getElementById("wv-reviews").textContent === "60");
  L("rescoreNoNaN", !rows().some(r => /NaN/.test(r.querySelector(".score").textContent)));

  // ---- filter interaction: uncheck a filter, re-run ----------------------
  if (scenario === "full") {
    d.querySelector('[data-on="reviews"]').checked = false;
    d.querySelector('[data-on="reviews"]').dispatchEvent(new w.Event("input", {bubbles:true}));
    await wait(500);
    d.getElementById("runBtn").click();
    await wait(2400);
    L("rerun_moreQualified", rows().length);
  }

  // ---- a failing source must be reported, not silently swallowed --------
  // Driven directly: the builder cannot express a deliberately-dead source,
  // and what needs checking is that the panel renders every kind of trouble.
  w.renderWarnings(
    {events_dropped: 12,
     stats: {source_errors: {overpass: "ConnectFail: connection refused"},
             skipped_places: {"overpass/Hackney": "could not be geocoded",
                              "overpass/Soho": "ReadTimeout: timed out"}}},
    {total: 40000, rows: new Array(5000)});
  await wait(300);
  const warn = d.getElementById("warnings").textContent;
  L("warns_sourceFailure", /source failed/i.test(warn));
  L("warns_skippedPlaces", /places were skipped/i.test(warn));
  L("warns_truncation", /Showing the first/i.test(warn) && /40,000/.test(warn));
  L("warns_droppedEvents", /dropped/i.test(warn));

  // ---- the third outcome: unevaluated must not read as rejected ---------
  const K = w.kerb;
  L("tabU_hiddenWhenNone", d.getElementById("tabU").hidden);
  K.S.rows = [
    {cid:"a", name:"Measured Good", outcome:"qualified", score:90.1,
     review_count:100, signals:{web_presence:{value:"none"},trade_match:{value:"dentist"}}},
    {cid:"b", name:"Measured Bad", outcome:"rejected", reject_reason:"reviews is 4, needs >= 30",
     review_count:4, signals:{web_presence:{value:"none"},trade_match:{value:"dentist"}}},
    {cid:"c", name:"Never Measured", outcome:"unevaluated",
     reject_reason:"web_presence could not be measured (ConnectionError) -- not judged",
     failed_signals:["web_presence"], review_count:80,
     signals:{trade_match:{value:"dentist"}}},
  ];
  K.renderTable();
  await wait(250);
  L("tabU_shownWhenPresent", !d.getElementById("tabU").hidden);
  L("counts_QRU", [d.getElementById("cQ").textContent, d.getElementById("cR").textContent,
                   d.getElementById("cU").textContent].join("/"));

  d.querySelector('[data-view="rejected"]').click(); await wait(200);
  const rejNames = Array.from(d.querySelectorAll("#rows tr[data-cid] .name")).map(x=>x.textContent.trim());
  L("rejectedTab_excludesUnevaluated", !rejNames.includes("Never Measured") && rejNames.includes("Measured Bad"));

  d.querySelector('[data-view="unevaluated"]').click(); await wait(200);
  const unevNames = Array.from(d.querySelectorAll("#rows tr[data-cid] .name")).map(x=>x.textContent.trim());
  L("unevaluatedTab_hasIt", unevNames.length===1 && unevNames[0]==="Never Measured");
  const reasonCell = d.querySelector("#rows tr[data-cid] .reason");
  L("unevaluated_notStyledAsRejection", reasonCell.classList.contains("unev"));

  d.querySelector('[data-view="qualified"]').click(); await wait(200);

  w.renderWarnings({stats:{unevaluated:1200, stopped_reason:"100% of the last 20 businesses could not be measured",
     discovery_health:{verdict:"throttled", yield_pct:41.2, suspect:6, searches:10, baseline:58, flagged:["Soho","Hackney"]}}},
    {total:3, rows:new Array(3)});
  await wait(250);
  const wtxt = d.getElementById("warnings").textContent;
  L("warns_unevaluated", /could not be measured/i.test(wtxt) && /Not rejected/i.test(wtxt));
  L("warns_throttled", /Discovery looks throttled/i.test(wtxt) && /41\.2%/.test(wtxt));

  // `.notice` is a column flex container: prose mixing text and inline <b>
  // directly inside it stacks each fragment on its own line. Any notice whose
  // text is a sentence must therefore have exactly one element child.
  const proseBroken = Array.from(d.querySelectorAll("#warnings .notice"))
    .filter(n => {
      const bare = Array.from(n.childNodes)
        .some(c => c.nodeType === 3 && c.textContent.trim().length > 0);
      return bare && n.children.length > 0;   // mixed text + elements
    }).length;
  L("warns_noStackedProse", proseBroken);

  // …and must clear itself when there is nothing wrong.
  w.renderWarnings({stats: {}}, {total: 5, rows: new Array(5)});
  await wait(200);
  L("warns_clearWhenClean", d.getElementById("warnings").innerHTML === "");
  w.renderWarnings(
    {stats: {source_errors: {overpass: "ConnectFail: connection refused"},
             skipped_places: {"overpass/Hackney": "could not be geocoded"}}},
    {total: 40000, rows: new Array(5000)});
  await wait(200);

  // ---- duplicate log lines after an SSE replay ---------------------------
  const logLines = Array.from(d.querySelectorAll("#log div")).map(x => x.textContent);
  L("logHasNoDuplicates", new Set(logLines).size === logLines.length || logLines.length === 0);

  // ---- CSV export must not throw ----------------------------------------
  const before2 = errs.length;
  d.getElementById("csvBtn").click(); await wait(500);
  L("csvExport_noThrow", errs.length === before2);

  // ---- theme toggle cycles ----------------------------------------------
  const tb = d.getElementById("themeBtn");
  const t0 = d.documentElement.getAttribute("data-theme");
  tb.click(); const t1 = d.documentElement.getAttribute("data-theme");
  tb.click(); const t2 = d.documentElement.getAttribute("data-theme");
  L("themeCycle", JSON.stringify([t0, t1, t2]));
  if (theme) d.documentElement.setAttribute("data-theme", theme);

  // ---- layout integrity --------------------------------------------------
  L("bodyNoHScroll", d.documentElement.scrollWidth <= W + 1);

  // The rail is gone; the brief is a full-page region. It has to be measured
  // while it is actually on screen -- a hidden element reports zero for both
  // scrollHeight and clientHeight, so a clip check run against the results
  // view passes without testing anything.
  d.getElementById("editBtn").click(); await wait(350);
  L("composeNoHScroll", d.documentElement.scrollWidth <= W + 1);
  const clipped = Array.from(d.querySelectorAll(".k-sec .hint, .k-sec > h3"))   // NOT .f-item p: that
    // text is line-clamped on purpose so every condition card ends at the
    // same height, and the full sentence is on the title attribute.
    .filter(el => el.scrollHeight > el.clientHeight + 1).length;
  L("clippedTextNodes", clipped);

  // The invariant is that the brief is never cropped -- not that it scrolls.
  // Now that conditions flow into columns it often fits outright, and asserting
  // "scrollHeight > clientHeight" would fail on a layout that got BETTER.
  const comp = d.getElementById("composer");
  L("composerNeverCrops", comp.scrollHeight <= comp.clientHeight
      || w.getComputedStyle(comp).overflowY === "auto");
  // The commit bar is sticky inside that scroller, so Run stays reachable no
  // matter how far down a long brief you are. Checked from the top, which is
  // where a sticky-bottom element is most likely to be off screen.
  comp.scrollTop = 0; await wait(150);
  const rb = d.getElementById("runBtn").getBoundingClientRect();
  L("runAlwaysReachable", rb.bottom <= H + 1 && rb.top >= 0);
  // Findings must survive the round trip back to the brief and out again.
  d.querySelector('.navtab[data-mode="findings"]').click(); await wait(250);
  L("modeSwitchKeepsRows", rows().length > 0);

  L("errors", JSON.stringify(errs));
  L("DONE", 1);
});
</script>
